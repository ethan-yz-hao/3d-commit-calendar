name: Update Commit History

on:
  schedule: [{cron: "0 */8 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  update-history:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # numpy 1.26.4 has no wheels for 3.13+ and fails on import there.
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run commit history script
      run: python main.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}

    # GitHub disables scheduled workflows in repositories that look inactive, which is
    # what silently stopped this job in January. An occasional empty commit keeps the
    # repository looking active. This runs even when the step above fails - a run of
    # failures is exactly when we can least afford to also lose the schedule.
    - name: Keepalive
      if: always() && github.event_name == 'schedule'
      run: |
        age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
        echo "Last commit was ${age} day(s) ago"
        if [ "$age" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive for scheduled workflow"
            git push
        fi
